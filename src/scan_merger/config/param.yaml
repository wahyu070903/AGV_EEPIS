scan_merger:
  ros__parameters:
    scan_topic_1: /right_scan
    scan_topic_2: /left_scan
    output_topic: /scan_merged
    target_frame: merge_lidar_link      # frame hasil gabungan (harus ada TF dari frame kedua lidar)
    angle_min: -3.14159265
    angle_max: 3.14159265
    angle_increment: 0.0087266   # ~0.5 derajat (720 titik)
    range_min: 0.05
    range_max: 30.0
    publish_rate: 20.0           # Hz
    max_scan_age: 0.2            # detik; scan lebih tua dari ini diabaikan

    # Filter badan robot (koordinat di target_frame, satuan meter)
    # [x_min, x_max, y_min, y_max]  -> x ke depan, y ke kiri
    exclude_box: [-0.6, 2.0, -0.62, 0.62]
    exclude_radius: 0.0            # buang lingkaran radius ini       

    