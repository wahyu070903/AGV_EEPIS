teleop_twist_joy:
  ros__parameters:

    enable_button: 4        # L1
    enable_turbo_button: 5  # R1

    axis_linear:
      x: 1                  # Left stick up/down

    axis_angular:
      yaw: 3                # Right stick left/right

    scale_linear:
      x: 1.4

    scale_linear_turbo:
      x: 2.2

    scale_angular:
      yaw: 1.4

    scale_angular_turbo:
      yaw: 3.14

    deadzone: 0.1
    autorepeat_rate: 20.0